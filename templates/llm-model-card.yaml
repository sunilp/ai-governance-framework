# LLM Model Card Template
# For foundation models, fine-tuned models, and LLM-based systems
# Adapted for enterprise GenAI governance

model_details:
  name: ""                              # e.g., "Customer Service Assistant v2.1"
  model_id: ""                          # Unique identifier
  version: ""                           # Semantic version
  type: ""                              # foundation | fine-tuned | rag-system | agent
  base_model: ""                        # Foundation model used (e.g., "Claude Sonnet 4.5", "Gemini 2.5 Pro", "Llama 3.3 70B")
  base_model_version: ""                # Specific version or checkpoint
  base_model_provider: ""               # OpenAI | Anthropic | Google | Meta | Self-hosted
  hosting: ""                           # vendor-api | self-hosted | vpc-hosted
  risk_tier: ""                         # T1 | T2 | T3 | T4
  date_deployed: ""                     # YYYY-MM-DD
  last_reviewed: ""                     # YYYY-MM-DD
  next_review: ""                       # YYYY-MM-DD
  owners:
    business_owner: ""
    technical_owner: ""
    risk_owner: ""

intended_use:
  primary_use_case: ""                  # Clear description of what the system does
  target_users: []                      # Who uses this system
  out_of_scope_uses: []                 # What this system should NOT be used for
  decision_type: ""                     # informational | recommendation | automated
  human_oversight_pattern: ""           # human-in-the-loop | human-on-the-loop | human-over-the-loop | human-out-of-the-loop
  human_oversight_safeguards:           # Required for T1 customer-facing systems using human-over-the-loop (Pattern 3 safeguards a-e, human-in-loop-patterns.md#pattern-selection-matrix)
    sampled_review: ""                  # a) Daily review of at least 1% of outputs (minimum 50 per day)
    risk_based_routing: []              # b) Topics and conditions routed to a human
    scope_guardrails: ""                # c) Output scope guardrails
    kill_switch: ""                     # d) Stops or degrades the AI channel within 15 minutes; tested at least quarterly
    kill_switch_last_tested: ""         # YYYY-MM-DD
    hallucination_monitoring: ""        # e) Monitoring against the tier hallucination threshold
  customer_facing: false                # true | false
  regulatory_context: []               # Applicable regulations

system_architecture:
  components:
    - name: ""                          # e.g., "prompt_router", "rag_retriever", "guardrail_layer"
      description: ""
      type: ""                          # prompt | retrieval | guardrail | orchestration | evaluation
  data_flows:
    - source: ""
      destination: ""
      data_classification: ""           # public | internal | confidential | pii | regulated
  rag_configuration:                    # If applicable
    enabled: false
    vector_store: ""                    # e.g., "BigQuery Vector Search", "Pinecone", "pgvector"
    embedding_model: ""
    chunking_strategy: ""
    chunk_size: null
    chunk_overlap: null
    retrieval_top_k: null
    reranking: false
    document_sources: []

prompt_governance:
  system_prompt_version: ""
  prompt_repository: ""                 # Git repo or path
  last_prompt_review: ""                # YYYY-MM-DD
  adversarial_testing_date: ""          # YYYY-MM-DD
  guardrails:
    input_validation: false
    output_filtering: false
    pii_redaction: false
    toxicity_gate: false
    hallucination_detection: false
    custom_rules: []

evaluation:
  evaluation_date: ""                   # YYYY-MM-DD
  evaluation_dataset_size: null         # Number of distinct pre-release test cases (T1 300+, T2 100+)
  # Statistical pass rule (evaluation-governance.md#statistical-pass-rule). At T1/T2 record, for each
  # framework metric:
  #   proportion metrics: n (cases) and failures (failing cases). The one-sided 95% Clopper-Pearson
  #     upper bound on the failure rate must be within the cap. For pass-rate metrics
  #     (safety_pass_rate) failures are the cases that did not pass.
  #   mean metrics (faithfulness, retrieval_precision_at_5, tool_call_accuracy): n, lower_bound
  #     (one-sided 95%) and interval_method: bootstrap | t-interval (t-interval only when n >= 100).
  # At T3/T4 the point estimate passes on at least the minimum suite size; n is optional.
  metrics:
    - name: "faithfulness"              # RAG systems
      value: null
      threshold: null
      method: ""                        # llm-as-judge | human-eval | automated | hybrid
      n: null
      lower_bound: null
      interval_method: ""               # bootstrap | t-interval
    - name: "hallucination_rate"
      value: null
      threshold: null
      method: ""
      n: null
      failures: null
    - name: "safety_pass_rate"          # Safety suite (T1 300+, T2 100+)
      value: null
      threshold: null
      method: ""
      n: null
      failures: null
    - name: "retrieval_precision_at_5"  # RAG systems; RAG retrieval set (T1 100+ queries)
      value: null
      threshold: null
      method: ""
      n: null
      lower_bound: null
      interval_method: ""
    - name: "guardrail_false_negative_rate"   # Systems with guardrails (EV-009); labelled harmful or out-of-scope set
      value: null
      threshold: null
      method: ""
      n: null
      failures: null
    - name: "guardrail_false_positive_rate"   # Labelled legitimate set; threshold from the risk assessment (default ceiling 5% customer-facing, 10% internal)
      value: null
      threshold: null
      method: ""
      n: null
      failures: null
    # Agentic systems only (EV-008), on the task suite (T1 300+, T2 100+ tasks):
    # - name: "task_success_rate"       # threshold from the risk assessment; n, failures (failed tasks)
    # - name: "tool_call_accuracy"      # threshold from the risk assessment; n (tasks), lower_bound, interval_method
    # - name: "unsafe_action_rate"      # threshold 0; n (tasks), failures. Any occurrence blocks release
    - name: "relevance"
      value: null
      threshold: null
      method: ""
    - name: "correctness"
      value: null
      threshold: null
      method: ""
    - name: "format_compliance"
      value: null
      threshold: null
      method: ""
  segment_results:                      # T1/T2: segments named in the risk assessment. Segments of 100+ cases must meet the threshold on the point estimate; smaller ones are reported, not gated
    - segment: ""                       # e.g., "channel: mobile app", "language: German"
      n: null
      results: {}                       # metric name: value
  human_evaluation:                     # T1/T2 when any metric uses human-eval or hybrid (evaluation-governance.md#human-evaluation-protocol)
    raters: ""                          # Who rated, and how they were qualified and trained
    double_rated_share: null            # At least 0.20
    agreement_statistic: ""             # cohen-kappa | krippendorff-alpha
    agreement: null                     # At least 0.6 before results are accepted
    adjudication: ""
  adversarial_testing:
    test_type: ""                       # red-team | prompt-change-regression (which suite test_suite_size counts)
    red_team_suite_size: null           # When test_type is prompt-change-regression: case count of the latest red-team
    red_team_report: ""                 # Red-team report ID
    prompt_injection_resistance: null    # Pass rate against injection test suite
    jailbreak_resistance: null
    test_suite_size: null
  bias_evaluation:
    tested_attributes: []               # e.g., ["gender", "ethnicity", "age"]
    counterfactual_consistency: null     # Pooled share of consistent pairs
    attribute_results:                  # T1/T2: one entry per attribute (T1 200+ pairs, T2 100+); failures = inconsistent pairs
      - attribute: ""
        n: null
        failures: null
    sentiment_parity: null              # Score
    methodology: ""
  production_evaluations:               # Post-deployment results (PM-004). Keep separate from the pre-release results above.
    - date: ""                          # YYYY-MM-DD
      activity: ""                      # online-scoring | metrics-review | offline-suite-rerun
      trigger: ""                       # schedule | model change | provider change | prompt change
      dataset_size: null
      results: {}                       # metric name: value
      outcome: ""                       # e.g., "pass", "fail: exception raised"

safety:
  hallucination_tolerance: ""           # e.g., "≤ 1%". The tier cap is a ceiling; a use-case tolerance applies only when stricter.
  toxicity_threshold: ""
  pii_leakage_tolerance: "zero"
  content_policy: ""                    # Reference to content policy document
  refusal_behavior: ""                  # Description of what the system refuses
  known_failure_modes: []               # Document known failure scenarios
  mitigations: []                       # Safety mitigations in place

operational:
  infrastructure:
    compute: ""                         # e.g., "GCP us-central1", "Azure East US"
    data_residency: ""                  # Where data is processed
  performance:
    latency_p50_ms: null
    latency_p95_ms: null
    latency_p99_ms: null
    throughput_rps: null
    availability_target: ""             # e.g., "99.9%"
  cost:
    estimated_monthly_cost: ""
    cost_per_request: ""
    token_budget_per_request: null
  monitoring:
    quality_monitoring: ""              # Real-time | sampled | periodic
    safety_monitoring: ""
    cost_monitoring: ""
    drift_detection: ""
    alerting_configured: false
    dashboard_url: ""
  incident_response:
    runbook_url: ""
    on_call_team: ""
    escalation_path: ""

vendor_risk:                            # If using external model provider
  provider: ""
  dpa_in_place: false
  data_retention_by_vendor: ""          # "None" | retention terms
  training_data_exclusion: false        # Vendor contractually excluded from using your data
  sla_uptime: ""
  exit_strategy_documented: false
  fallback_model: ""
  fallback_validated: false
  last_vendor_assessment: ""            # YYYY-MM-DD

limitations:
  technical_limitations: []             # Known technical limitations
  knowledge_cutoff: ""                  # Base model knowledge cutoff date
  language_limitations: []              # Languages with degraded performance
  domain_limitations: []                # Domains where performance is unreliable
  ethical_considerations: []
  regulatory_constraints: []

approvals:
  - role: ""                            # e.g., "Business Owner", "AI Risk Committee"
    name: ""
    date: ""                            # YYYY-MM-DD
    decision: ""                        # approved | approved-with-conditions | rejected

change_history:
  - version: ""
    date: ""                            # YYYY-MM-DD
    description: ""
    approved_by: ""
