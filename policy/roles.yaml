# Governance roles. Source of truth for the "Role Definitions" table in
# framework/operating-model/roles-responsibilities.md. Control owners in controls/*.yaml
# and approvers in policy/tiers.yaml refer to these ids.
# label: the short form used in the control register, when it differs from name.
# line_of_defence: 1, 2 or 3 (a list when it depends on the reporting line);
# line_of_defence_text overrides the rendered cell when it needs a qualifier.
# After editing, run: python tools/build.py && python tools/check.py

roles:

- id: business-owner
  name: Business owner
  line_of_defence: [1]
  description: Senior business stakeholder who owns the use case and its outcomes and accepts the residual risk. Exactly one per system. Co-signs T3 deployments.

- id: business-unit-head
  name: Business Unit Head
  line_of_defence: [1]
  description: Head of the business unit that uses the system. Co-signs T2 deployments.

- id: product-owner
  name: Product owner
  line_of_defence: [1]
  description: 'Owns delivery of the system before production: prepares the risk assessment and impact assessment (RA-001, RA-003), assembles the evidence pack and runs the sign-off chain (DA-001, DA-002), and sets up human oversight (PM-003).'

- id: system-owner
  name: System owner
  line_of_defence: [1]
  description: 'Owns the system in production: scheduled reviews (RV-001), red-team finding closure before release (SR-002), remediation tracking (IR-005) and deprecation impact assessments (DR-001).'

- id: technical-owner
  name: Technical owner
  line_of_defence: [1]
  description: Engineer responsible for architecture, data residency, guardrails, adversarial defences, rollback and decommissioning (AR-001, AR-003, DE-004, SR-003, DA-004, DR-004). Documents the architecture for T3/T4 systems.

- id: ai-lead
  name: AI lead
  line_of_defence: [1]
  description: 'Technical lead for model and prompt development and evaluation: model selection document, model card, prompt version control and review, evaluation evidence, revalidation (AR-004, DE-001 to DE-003, DE-005, EV controls, RV-002, RV-003). The Data Science Lead fills this role for traditional ML.'

- id: ai-operations
  name: AI Operations
  line_of_defence: [1]
  description: 'Runs AI systems in production: monitoring, alerting, production evaluation, cost monitoring, on-call and incident playbooks (DA-003, PM-001, PM-002, PM-004, PM-005, IR-001, IR-002). Covers MLOps and LLMOps.'

- id: team-lead
  name: Team lead
  line_of_defence: [1]
  description: Leads the delivery team. Approves T3/T4 risk assessments, model selection from the approved vendor list and deployments, and T4 exceptions.

- id: head-of-ai
  name: Head of AI
  line_of_defence: [1]
  description: Senior technology leader for AI. Approves T2 deployments (with the Business Unit Head), T2 model selection, T2 design reviews (or a delegate) and T3 exceptions.

- id: architecture-review-board
  name: Architecture review board
  line_of_defence: [1]
  description: Cross-functional technical forum that signs off T1 architecture (AR-002).

- id: security
  name: Security
  line_of_defence: [1]
  description: Security engineering function. Runs security review and red-teaming and verifies supply chain provenance (SR-001, SR-004).

- id: ciso
  name: CISO
  line_of_defence: [1]
  line_of_defence_text: First (some organisations place this role in the second line)
  description: Senior security executive. Co-signs T1 deployments and T1 model selection; consulted on the security terms of open-source and model licences.

- id: responsible-ai-lead
  name: Responsible AI lead
  line_of_defence: [1, 2]
  line_of_defence_text: First or second, depending on reporting line
  description: Designs and owns bias evaluation and fairness standards (EV-005). See [roles-genai.md](roles-genai.md#ai-ethics-and-responsible-ai-lead).

- id: ai-risk
  name: AI Risk (second line)
  label: AI Risk
  line_of_defence: [2]
  description: Independent AI risk function. Approves T2 risk assessments, reviews auto-T1 override decisions (RA-002), runs third-party model risk assessments (AR-005) and challenges tiering. The head of AI Risk approves T2 exceptions. May perform T2 independent validation.

- id: mrm
  name: Model Risk Management (MRM)
  label: MRM
  line_of_defence: [2]
  description: 'Second-line function that performs independent validation: full validation for T1, reduced-scope validation for T2 (or another second-line reviewer does it).'

- id: dpo
  name: DPO
  line_of_defence: [2]
  description: Data Protection Officer. Oversees DPIA screening and DPIAs (RA-005) and co-signs T1 deployments that process personal data.

- id: compliance
  name: Compliance
  line_of_defence: [2]
  description: Identifies applicable regulation, maps controls to it, assesses regulatory change (RV-004) and decides on regulatory notification with Legal.

- id: legal
  name: Legal
  line_of_defence: [2]
  description: Approves open-source and model licences (AI Risk consulted; CISO consulted on security terms) and reviews regulatory notifications.

- id: ai-risk-committee
  name: AI Risk Committee
  line_of_defence: [2]
  line_of_defence_text: Second (oversight forum)
  description: Senior forum chaired by the CRO. Approves T1 risk assessments, model selection, deployments and exceptions. Meets monthly, with a quarterly full-portfolio meeting ([review-cadence.md](review-cadence.md)).

- id: incident-commander
  name: Incident commander
  line_of_defence: [1]
  description: Named for each incident. Leads the response, files the incident report (IR-003) and runs the post-mortem (IR-004).

- id: internal-audit
  name: Internal Audit
  line_of_defence: [3]
  description: Independent assurance over the governance framework.
