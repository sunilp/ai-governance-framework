# Internal Knowledge Search — Model Card
# Risk Tier: T3 (Medium) — Internal-only RAG search, no customer-facing, no regulated decisions

model_details:
  name: "Internal Knowledge Search"
  model_id: "knowledge-search-v1.0"
  version: "1.0.0"
  type: "rag-system"
  base_model: "Claude Haiku 4.5"
  base_model_version: "claude-haiku-4-5-20251001"
  base_model_provider: "Anthropic"
  hosting: "vendor-api"
  risk_tier: "T3"
  date_deployed: "2026-02-15"
  last_reviewed: "2026-02-15"
  next_review: "2027-02-15"           # Annual governance review (T3)
  owners:
    business_owner: "Head of IT Services"
    technical_owner: "AI Platform Team Lead"
    risk_owner: "AI Operations"

intended_use:
  primary_use_case: >
    Help employees find information across the internal knowledge base —
    HR policies, IT procedures, product documentation, onboarding guides.
    Employees ask natural language questions and receive answers with
    source attribution.
  target_users:
    - "All employees"
  out_of_scope_uses:
    - "Customer-facing support"
    - "Regulatory or legal advice"
    - "Financial decision support"
    - "Processing customer PII"
    - "Making employment decisions"
  decision_type: "informational"
  human_oversight_pattern: "human-on-the-loop"
  customer_facing: false
  regulatory_context:
    - "Internal use only — no direct regulatory requirements"
    - "General data protection obligations apply to employee data (DPIA screening 2026-02-09: not high risk)"

system_architecture:
  components:
    - name: "query_processor"
      description: "Processes employee question and generates search query"
      type: "prompt"
    - name: "document_retriever"
      description: "Retrieves relevant documents from internal knowledge base"
      type: "retrieval"
    - name: "answer_generator"
      description: "Generates answer with source attribution from retrieved documents"
      type: "prompt"
    - name: "basic_guardrails"
      description: "Input validation and output content filtering"
      type: "guardrail"
  data_flows:
    - source: "employee_query"
      destination: "query_processor"
      data_classification: "internal"     # May contain incidental personal data typed by the employee
    - source: "document_retriever"
      destination: "answer_generator"
      data_classification: "internal"
    - source: "answer_generator"
      destination: "Anthropic API (Claude Haiku 4.5; DPA, zero retention)"
      data_classification: "internal"
    - source: "answer_generator"
      destination: "employee"
      data_classification: "internal"
    - source: "query_log (employee name, role, query, response)"
      destination: "audit_store (tokenized; 3-year retention)"
      data_classification: "pii"
  rag_configuration:
    enabled: true
    vector_store: "Cloud SQL pgvector"
    embedding_model: "text-embedding-004"
    chunking_strategy: "semantic"
    chunk_size: 512
    chunk_overlap: 64
    retrieval_top_k: 5
    reranking: false
    document_sources:
      - "HR policy documents (internal)"
      - "IT procedures and runbooks (internal)"
      - "Product documentation (internal)"
      - "Onboarding guides (internal)"
      - "FAQ database (internal)"

prompt_governance:
  system_prompt_version: "v1.0.0"
  prompt_repository: "git://internal/ai-prompts/knowledge-search"
  last_prompt_review: "2026-02-10"
  adversarial_testing_date: "2026-02-12"
  guardrails:
    input_validation: true
    output_filtering: true
    pii_redaction: false
    toxicity_gate: false
    hallucination_detection: false
    custom_rules:
      - "Always cite source documents"
      - "Decline questions outside the knowledge base scope"
      - "Do not provide legal, medical, or financial advice"

# T3 evaluation — lighter requirements than T1/T2
evaluation:
  evaluation_date: "2026-02-12"
  evaluation_dataset_size: 50
  metrics:
    - name: "faithfulness"
      value: 0.91
      threshold: 0.85
      method: "human-eval"
    - name: "relevance"
      value: 0.88
      threshold: 0.80
      method: "human-eval"
    - name: "hallucination_rate"
      value: 0.04                       # 2 of 50. T3 passes on the point estimate (evaluation-governance.md#statistical-pass-rule)
      threshold: 0.05
      method: "human-eval"
      n: 50
      failures: 2
    - name: "source_attribution_accuracy"
      value: 0.94
      threshold: 0.90
      method: "automated"
    - name: "safety_pass_rate"          # 50-case safety suite; 2 failures
      value: 0.96
      threshold: 0.95
      method: "automated"
      n: 50
      failures: 2
    - name: "retrieval_precision_at_5"  # 50-query retrieval set
      value: 0.80
      threshold: 0.75
      method: "automated"
    - name: "guardrail_false_negative_rate"   # 50 labelled out-of-scope and injection queries; 1 passed (EV-009)
      value: 0.02
      threshold: 0.05
      method: "automated"
      n: 50
      failures: 1
    - name: "guardrail_false_positive_rate"   # 50 legitimate queries; 3 blocked; internal default ceiling 10%
      value: 0.06
      threshold: 0.10
      method: "automated"
      n: 50
      failures: 3
  # Red-team (T3): automated adversarial scan of 200 generated prompts plus 50 manual cases.
  adversarial_testing:
    test_type: "red-team"
    prompt_injection_resistance: 0.90
    jailbreak_resistance: 0.92
    test_suite_size: 250
  bias_evaluation:
    tested_attributes:
      - "employee_name"                 # Names varied by gender and ethnic origin
      - "work_location"
    counterfactual_consistency: 0.88    # T3 threshold 0.80
    sentiment_parity: 0.94
    methodology: >
      Light counterfactual check, 50 pairs: HR-policy questions asked with the
      employee name or work location swapped. A pair passes when both answers
      cite the same policy and entitlement. Not a T3 release requirement; run
      because HR answers could differ by employee attributes.

safety:
  hallucination_tolerance: "≤ 5%"
  toxicity_threshold: "Platform output filter default; responses above the toxicity classifier threshold are blocked"
  pii_leakage_tolerance: "low risk — internal users, no customer PII in corpus"
  content_policy: "Standard acceptable use policy"
  refusal_behavior: "Declines questions outside the knowledge base and requests for legal, medical or financial advice; points the employee to the owning team"
  known_failure_modes:
    - "May return outdated information if documents not refreshed"
    - "Cannot answer questions requiring cross-document synthesis well"
    - "May provide overly confident answers for ambiguous policies"
  mitigations:
    - "Source attribution on every answer — users can verify"
    - "Disclaimer: 'This is a search assistant. For authoritative answers, consult the source document.'"
    - "Document refresh pipeline runs weekly"

operational:
  infrastructure:
    compute: "GCP europe-west1 (application layer)"
    data_residency: "EU — all documents and processing within EU"
  performance:
    latency_p50_ms: 2000
    latency_p95_ms: 5000
    latency_p99_ms: 8000
    throughput_rps: 20
    availability_target: "99%"
  cost:
    estimated_monthly_cost: "$500"
    cost_per_request: "$0.005"
    token_budget_per_request: 4000
  monitoring:
    quality_monitoring: "Automated scoring of a 5% sample of responses; monthly metrics review including a human spot-check of 50 sampled responses"
    safety_monitoring: "Basic input validation; weekly review of flagged queries"
    cost_monitoring: "Monthly cost review"
    drift_detection: "Vendor behaviour canary on a fixed question set monthly; RAG retrieval evaluation quarterly; full offline suite re-run semi-annually and on any model, provider or prompt change"
    alerting_configured: true
    dashboard_url: "internal://dashboards/knowledge-search"
  incident_response:
    runbook_url: "internal://runbooks/knowledge-search"
    on_call_team: "AI Platform On-Call"
    escalation_path: "On-call → AI Platform Lead"

vendor_risk:
  provider: "Anthropic"
  dpa_in_place: true
  data_retention_by_vendor: "None (zero retention)"
  training_data_exclusion: true
  sla_uptime: "99.9%"
  exit_strategy_documented: false
  fallback_model: "None — service degradation acceptable"
  fallback_validated: false             # No fallback by design; employees search documents manually during an outage
  last_vendor_assessment: "2026-01-20"

limitations:
  technical_limitations:
    - "Answers limited to content in the knowledge base"
    - "No real-time data access"
    - "English only"
  knowledge_cutoff: "Not relied on: answers come from the knowledge base (refreshed weekly), not base model knowledge"
  language_limitations:
    - "English only; other languages not validated"
  domain_limitations:
    - "Internal policies and procedures only"
    - "Cannot provide legal, medical, or financial advice"
  ethical_considerations:
    - "May surface outdated policies — users should verify with source document"
    - "Potential for over-reliance — employees should still read full policy documents for important decisions"
  regulatory_constraints:
    - "Employee personal data in query logs: tokenized, access-restricted, 3-year retention (DPIA screening 2026-02-09)"
    - "Must not be used for employment decisions; that would trigger automatic T1 (override item 1)"

# Governance notes: this system demonstrates T3 governance. Compared with T1 systems
# (for example, the agentic research assistant), T3 governance is lighter: no board
# reporting, no quarterly red-team retesting, peer review instead of independent
# validation, an annual governance review (T1: quarterly), and a simpler model card.
# Governance scales with risk.

approvals:
  - role: "AI Platform Lead"
    name: "AI Platform Team Lead"
    date: "2026-02-14"
    decision: "approved"
  - role: "IT Services"
    name: "Head of IT Services"
    date: "2026-02-14"
    decision: "approved"

change_history:
  - version: "1.0.0"
    date: "2026-02-15"
    description: "Initial production deployment"
    approved_by: "AI Platform Team Lead"
