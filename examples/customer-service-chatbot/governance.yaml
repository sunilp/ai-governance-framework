# Conditional controls the system does not meet. The approver confirms each reason.
not_applicable:
  - control: RA-009
    reason: Not an Annex III system. The assistant gives information only and makes no decision about customers (decision_type informational in the model card).
  - control: DE-008
    reason: The RAG sources are customer-facing documents with no per-user access restrictions (rag_configuration.document_sources in the model card). Account data comes from a read-only API scoped to the authenticated customer, not from the index.
  - control: DE-009
    reason: Makes and assists no decisions about people. Credit, complaints, fraud disputes and account changes are out of scope and routed to human agents.

# No exceptions were needed for v1.2.0 (case file Section 6: no conditional passes or waivers).
exceptions: []
