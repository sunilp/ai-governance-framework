# Governance gate input for the customer service chatbot (v1.2.0 release).
# Read by reference-implementations/governance-gate/gate.py. Format and matching rule:
# reference-implementations/README.md. Paths are relative to this file.
#
# Run from the repository root:
#   python reference-implementations/governance-gate/gate.py examples/customer-service-chatbot/governance.yaml
#
# The files under evidence/ are placeholders that point to the case file, risk assessment and
# model card. Placeholders marked "Gap in this example" stand in for records the example does
# not yet show. The gate checks that evidence is registered and present, not that it is adequate.

schema_version: 1

system:
  id: cs-assistant-retail-v1.2
  name: Retail Banking Customer Service Assistant
  tier: T1
  types: [genai, rag, customer-facing, external-model, external-data-flow, personal-data]
  dpia_legally_required: true     # DPO screening outcome; true makes RA-005 non-waivable

framework:
  path: ../..                     # a system repository points at its pinned copy of this framework
  ref: null                       # tag or commit of that copy, recorded in gate-result.json

eval_report: evidence/eval-report.json

evidence:
  RA-001: evidence/RA-001-risk-assessment.md
  RA-002: evidence/RA-002-override-check.md
  RA-003: evidence/RA-003-impact-assessment.md
  RA-004: evidence/RA-004-risk-assessment-approval.md
  RA-005: evidence/RA-005-dpia.md
  RA-006: evidence/RA-006-inventory-entry.md
  RA-007: evidence/RA-007-prohibited-use-screen.md
  RA-008: evidence/RA-008-eu-ai-act-role.md
  AR-001: evidence/AR-001-architecture-document.md
  AR-002: evidence/AR-002-architecture-review.md
  AR-003: evidence/AR-003-data-residency.md
  AR-004: evidence/AR-004-model-selection.md
  AR-005: evidence/AR-005-vendor-risk-assessment.md
  AR-007: evidence/AR-007-vendor-contract-check.md
  DE-001: evidence/DE-001-model-card.md
  DE-002: evidence/DE-002-prompt-version-history.md
  DE-003: evidence/DE-003-prompt-review.md
  DE-004: evidence/DE-004-guardrail-configuration.md
  DE-006: evidence/DE-006-ai-disclosure.md
  DE-007: evidence/DE-007-output-marking.md
  EV-001: [evidence/EV-001-pre-release-evaluation.md, evidence/eval-report.json]
  EV-002: [evidence/EV-002-safety-evaluation.md, evidence/eval-report.json]
  EV-003: evidence/EV-003-regression-report.md
  EV-004: [evidence/EV-004-rag-retrieval-evaluation.md, evidence/eval-report.json]
