# Customer Service Chatbot: Model Card
# Risk Tier: T1 (Critical). Override trigger 2: customer-facing content delivered without per-output human review.
# Current state: v1.2.0 (deployed 2026-01-10). Governance trail: governance-case-file.md

model_details:
  name: "Retail Banking Customer Service Assistant"
  model_id: "cs-assistant-retail-v1.2"
  version: "1.2.0"
  type: "rag-system"
  base_model: "Claude Sonnet 4.5"
  base_model_version: "claude-sonnet-4-5-20250929"
  base_model_provider: "Anthropic"
  hosting: "vendor-api"
  risk_tier: "T1"
  date_deployed: "2025-09-15"             # v1.0.0 on claude-sonnet-4-20250514
  last_reviewed: "2026-03-10"             # Q1 2026 quarterly governance review (RV-001)
  next_review: "2026-06-10"
  owners:
    business_owner: "Head of Retail Banking Digital"
    technical_owner: "AI Platform Engineering Lead"
    risk_owner: "AI Risk Committee"

intended_use:
  primary_use_case: >
    Assist retail banking customers with account inquiries, product information,
    transaction history questions, and general banking guidance via the mobile app
    and online banking chat interface.
  target_users:
    - "Retail banking customers (authenticated)"
  out_of_scope_uses:
    - "Investment advice or portfolio recommendations"
    - "Credit decisions or pre-approval indications"
    - "Complaint resolution (escalated to human agent)"
    - "Account modifications (transfers, closures, limit changes)"
    - "Fraud dispute handling"
    - "Regulatory or legal guidance"
  decision_type: "informational"
  human_oversight_pattern: "human-over-the-loop"
  human_oversight_safeguards:             # T1 Pattern 3 safeguards a-e (human-in-loop-patterns.md#pattern-selection-matrix)
    sampled_review: "5% of responses reviewed daily, never fewer than 50, by trained customer service quality reviewers"
    risk_based_routing:
      - "Complaints"
      - "Vulnerability indicators"
      - "Fee or pricing disputes"
      - "Anything that looks like regulated advice (investment, credit)"
      - "Low-confidence responses"
      - "Unsupported languages"
    scope_guardrails: "Output guardrails and custom rules in prompt_governance.guardrails"
    kill_switch: "Stops the AI channel and routes all chats to human agents within 15 minutes; tested quarterly"
    kill_switch_last_tested: "2026-03-04"
    hallucination_monitoring: "Every response scored (async); P2 alert if rolling 7-day rate > 1%, P1 alert if rolling 24-hour rate > 2%"
  customer_facing: true
  regulatory_context:
    - "EU AI Act (Article 50, transparency)"
    - "GDPR (data processing, right to explanation)"
    - "Consumer Duty (FCA, fair customer outcomes)"
    - "PSD2 (payment account information)"

system_architecture:
  components:
    - name: "intent_classifier"
      description: "Classifies customer intent to route to appropriate handler"
      type: "orchestration"
    - name: "rag_retriever"
      description: "Retrieves relevant product documentation, FAQs, and policy documents"
      type: "retrieval"
    - name: "account_context"
      description: "Fetches authenticated customer's account summary (read-only API)"
      type: "orchestration"
    - name: "input_guardrails"
      description: "PII detection, prompt injection defense, intent boundary enforcement"
      type: "guardrail"
    - name: "output_guardrails"
      description: "Compliance check, PII redaction, hallucination flag, tone validation"
      type: "guardrail"
    - name: "response_generator"
      description: "LLM generates response using context and guardrails"
      type: "prompt"
    - name: "escalation_router"
      description: "Routes to human agent when confidence is low or topic is out of scope"
      type: "orchestration"
  data_flows:
    - source: "customer_query"
      destination: "input_guardrails"
      data_classification: "pii"
    - source: "input_guardrails"
      destination: "intent_classifier"
      data_classification: "internal"
    - source: "rag_retriever"
      destination: "response_generator"
      data_classification: "internal"
    - source: "account_context"
      destination: "response_generator"
      data_classification: "confidential"
    - source: "response_generator"
      destination: "output_guardrails"
      data_classification: "internal"
    - source: "output_guardrails"
      destination: "customer"
      data_classification: "internal"
  rag_configuration:
    enabled: true
    vector_store: "BigQuery Vector Search"
    embedding_model: "text-embedding-004"
    chunking_strategy: "semantic"
    chunk_size: 512
    chunk_overlap: 64
    retrieval_top_k: 5
    reranking: true
    document_sources:
      - "Product documentation (retail banking)"
      - "Customer FAQ knowledge base"
      - "Policy and procedure documents (customer-facing subset)"
      - "Fee schedules and terms"

prompt_governance:
  system_prompt_version: "v2.0.0"         # Major version: retargeted to claude-sonnet-4-5-20250929 for v1.2.0. v1.2.3 served v1.0.0 and v1.1.0.
  prompt_repository: "git://internal/ai-prompts/cs-assistant"
  last_prompt_review: "2026-01-05"        # Full T1 review (DE-003): peer, prompt engineering lead, security, AI Risk sign-off
  adversarial_testing_date: "2026-01-07"
  guardrails:
    input_validation: true
    output_filtering: true
    pii_redaction: true
    toxicity_gate: true
    hallucination_detection: true
    custom_rules:
      - "No investment advice or return predictions"
      - "No credit decisions or pre-approval indications"
      - "Escalate complaints to human agent"
      - "No account modifications"
      - "All financial figures must be sourced from account API or documents"

evaluation:
  evaluation_date: "2026-01-08"           # v1.2.0 revalidation (RV-003). Pre-release results for v1.0.0 (2025-09-01) are in the case file.
  evaluation_dataset_size: 500
  # T1 statistical pass rule (evaluation-governance.md#statistical-pass-rule): proportion metrics pass on the
  # one-sided 95% Clopper-Pearson upper bound of the failure rate, mean metrics on the one-sided 95% lower bound.
  metrics:
    - name: "faithfulness"
      value: 0.94
      threshold: 0.90
      method: "llm-as-judge"
      n: 500
      lower_bound: 0.933
      interval_method: "t-interval"
    - name: "relevance"
      value: 0.91
      threshold: 0.85
      method: "llm-as-judge"
    - name: "hallucination_rate"
      value: 0.002                        # 1 of 500; upper bound 0.95%, within the 1% cap
      threshold: 0.01
      method: "hybrid"                    # LLM-as-judge + human eval
      n: 500
      failures: 1
    - name: "correctness"
      value: 0.96
      threshold: 0.95
      method: "human-eval"
    - name: "format_compliance"
      value: 0.99
      threshold: 0.95
      method: "automated"
    - name: "escalation_appropriateness"
      value: 0.93
      threshold: 0.90
      method: "human-eval"
    - name: "safety_pass_rate"            # 500-case safety suite; 1 failure, failure-rate upper bound 0.95%
      value: 0.998
      threshold: 0.99
      method: "automated"
      n: 500
      failures: 1
    - name: "retrieval_precision_at_5"    # 200-query RAG retrieval set
      value: 0.88
      threshold: 0.85
      method: "automated"
      n: 200
      lower_bound: 0.861
      interval_method: "t-interval"
    - name: "guardrail_false_negative_rate"   # 300 labelled harmful or out-of-scope items; upper bound 0.99%
      value: 0.0
      threshold: 0.01
      method: "automated"
      n: 300
      failures: 0
    - name: "guardrail_false_positive_rate"   # 300 legitimate requests; upper bound 3.91%; customer-facing default ceiling 5%
      value: 0.02
      threshold: 0.05
      method: "automated"
      n: 300
      failures: 6
  segment_results:                        # Channel, language and vulnerability segments. 100+ cases gated on the point estimate; smaller segments reported, not gated
    - segment: "channel: mobile app"
      n: 310
      results: {hallucination_rate: 0.003, faithfulness: 0.94}
    - segment: "channel: online banking"
      n: 190
      results: {hallucination_rate: 0.0, faithfulness: 0.94}
    - segment: "language: English"
      n: 340
      results: {hallucination_rate: 0.003, faithfulness: 0.96}
    - segment: "language: German"         # 80 cases: reported, not gated (see Q1 2026 review finding 1 in the case file)
      n: 80
      results: {hallucination_rate: 0.0, faithfulness: 0.89}
    - segment: "language: French and Spanish"
      n: 80
      results: {hallucination_rate: 0.0, faithfulness: 0.91}
    - segment: "vulnerability indicator present"
      n: 60
      results: {hallucination_rate: 0.0, faithfulness: 0.93}
  human_evaluation:
    raters: "Customer service quality reviewers, qualified on a known-answer set; written rubric and a calibration session before the evaluation"
    double_rated_share: 0.20              # 100 of 500 cases
    agreement_statistic: "cohen-kappa"
    agreement: 0.84
    adjudication: "A senior quality reviewer resolves disagreements; the adjudicated label is recorded"
  adversarial_testing:                    # Prompt-change adversarial regression set re-run for v1.2.0, not the quarterly red-team
    test_type: "prompt-change-regression"
    prompt_injection_resistance: 0.98
    jailbreak_resistance: 0.97
    test_suite_size: 150
  bias_evaluation:
    tested_attributes:
      - "gender"
      - "age_group"
      - "nationality"
      - "language_preference"
    counterfactual_consistency: 0.95      # 40 inconsistent pairs in 800
    attribute_results:                    # T1 allows at most 12 inconsistent pairs in 200 per attribute
      - {attribute: "gender", n: 200, failures: 9}
      - {attribute: "age_group", n: 200, failures: 10}
      - {attribute: "nationality", n: 200, failures: 11}   # upper bound 8.94%, within the 10% cap
      - {attribute: "language_preference", n: 200, failures: 10}
    sentiment_parity: 0.97
    methodology: "Counterfactual testing with 200 pairs per attribute. Formal evaluation quarterly; production counterfactual spot-checks weekly since v1.2.0"
  production_evaluations:
    - date: "2026-03-15"
      activity: "online-scoring"
      trigger: "schedule"
      dataset_size: null
      results:
        hallucination_rate_rolling_7d: 0.011
        hallucination_rate_rolling_24h_peak: 0.015
      outcome: "fail: P2 alert; incident GEN-2026-042 (S2). Stale RAG documents replaced the same day"

safety:
  hallucination_tolerance: "≤ 1%"
  toxicity_threshold: "Zero tolerance"
  pii_leakage_tolerance: "zero"
  content_policy: "Retail banking customer communication standards"
  refusal_behavior: >
    Declines investment advice, credit decisions, complaint handling, and
    account modifications. Offers to connect with a human agent for these topics.
  known_failure_modes:
    - "May provide outdated fee information if RAG corpus not refreshed within SLA"
    - "Complex multi-product comparison queries sometimes generate incomplete responses"
    - "Non-English queries in less-supported languages may have lower accuracy"
  mitigations:
    - "RAG corpus refresh SLA: daily for product docs, weekly for policies"
    - "Refresh pipeline health monitoring with P2 alert on failure (added after GEN-2026-042)"
    - "Complex query detection → escalation to human agent"
    - "Language detection → unsupported languages routed to human agent"

operational:
  infrastructure:
    compute: "GCP europe-west1 (application layer)"
    data_residency: "EU (application, RAG, and model inference on Vertex AI EU region)"
  performance:
    latency_p50_ms: 1200
    latency_p95_ms: 2800
    latency_p99_ms: 4500
    throughput_rps: 50
    availability_target: "99.9%"
  cost:
    estimated_monthly_cost: "€18,000"
    cost_per_request: "€0.03"
    token_budget_per_request: 4000
  monitoring:
    quality_monitoring: "Every response (async LLM-as-judge)"
    safety_monitoring: "Real-time guardrail monitoring"
    cost_monitoring: "Real-time with daily budget alerts"
    drift_detection: "Vendor behaviour canary: 100 fixed domain queries, daily"
    metrics_review: "Daily dashboard check by AI Operations; monthly system-owner review"
    offline_suite_rerun: "Monthly, and on any model, provider or prompt change"
    rag_retrieval_evaluation: "Weekly"
    alerting_configured: true
    dashboard_url: "internal://dashboards/cs-assistant"
  incident_response:
    playbook_id: "CS-ASSIST-IRP-v1.0"     # IR-001
    runbook_url: "internal://runbooks/cs-assistant"
    on_call_team: "AI Platform On-Call"   # IR-002
    escalation_path: "On-call → AI Platform Lead → Head of AI → CTO"

vendor_risk:
  provider: "Anthropic"
  dpa_in_place: true
  data_retention_by_vendor: "None (zero retention API)"
  training_data_exclusion: true
  sla_uptime: "99.9%"
  exit_strategy_documented: true
  fallback_model: "Gemini 2.5 Pro (gemini-2.5-pro, GCP Vertex AI, EU region)"
  fallback_validated: true                # Validated 2025-09-02; re-validated with prompt v2.0.0 on 2026-01-08
  last_vendor_assessment: "2025-12-15"

limitations:
  technical_limitations:
    - "Cannot process images or documents uploaded by customers"
    - "Context window limits multi-turn conversations to ~20 turns before context truncation"
    - "Response latency increases under high load (>40 RPS)"
  knowledge_cutoff: "RAG-grounded; no reliance on base model knowledge for banking information"
  language_limitations:
    - "Optimized for English and German"
    - "French, Spanish: acceptable quality"
    - "Other languages: not validated, routed to human agent"
  domain_limitations:
    - "Investment products (deliberately excluded)"
    - "Insurance products (not in scope)"
    - "Business banking (separate system)"
  ethical_considerations:
    - "Must not create false sense of personalization that misleads customers"
    - "Must not discourage customers from seeking human assistance"
    - "Vulnerable customer detection and appropriate routing"
  regulatory_constraints:
    - "Cannot provide personalized financial advice (MiFID II)"
    - "Must disclose AI nature of interaction (EU AI Act Article 50)"
    - "Must offer human alternative (Consumer Duty)"

