# Stage 9 controls: Ongoing Governance.
# Source of truth for the Stage 9 table(s) in framework/governance-operations/control-register.md.
# After editing, run: python tools/build.py && python tools/check.py
# Field reference: tools/README.md. Schema: schemas/controls.schema.json

stage: 9
name: Ongoing Governance
controls:

- id: RV-001
  title: Formal governance review completed
  stage: 9
  applies_to:
    text: T1-T4
    tiers: [T1, T2, T3, T4]
    systems: [all]
  owner: system-owner
  evidence: Review record with findings, actions and risk re-assessment (re-tiering check)
  frequency: Quarterly (T1); semi-annual (T2); annual (T3); annual self-assessment (T4)
  on_fail: Overdue review flagged in governance metrics; escalate after 30 days
  type: detective
  automation: manual
  key_control: true
  test: Take the full inventory of production systems with their last formal review date and recalculate overdue reviews against the tier cadence. Confirm every review overdue by more than 30 days was escalated and shown in governance metrics.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/operating-model/review-cadence.md

- id: RV-002
  title: Model card updated
  stage: 9
  applies_to:
    text: T1-T4
    tiers: [T1, T2, T3, T4]
    systems: [all]
  owner: ai-lead
  evidence: Updated model card with current information
  frequency: At each review
  on_fail: Block until updated
  type: detective
  automation: manual
  key_control: false
  test: Sample 25 completed formal reviews from the period (or all, if fewer). Confirm the model card was updated on or after the review date and matches the deployed version.
  sources:
  - framework/governance-operations/governance-workflow.md

- id: RV-003
  title: Revalidation on material change
  stage: 9
  applies_to:
    text: T1-T4
    tiers: [T1, T2, T3, T4]
    systems: [all]
  owner: ai-lead
  evidence: Revalidation assessment + eval results
  frequency: On material change (model, provider, major prompt version, scope, data, autonomy or regulation). Independent revalidation also annual (T1) and every 24 months (T2)
  on_fail: Re-enter deployment gates
  type: preventive
  automation: manual
  key_control: true
  test: Sample 25 changes from the change log (or all, if fewer), including prompt changes recorded as minor versions. Confirm each was classified against the material change definition, that each material change was revalidated before release, and that no T1/T2 scheduled independent revalidation is overdue.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/model-lifecycle/validation.md
  - framework/operating-model/review-cadence.md

- id: RV-004
  title: Regulatory change impact assessed
  stage: 9
  applies_to:
    text: 'T1-T3 (T4: recommended)'
    tiers: [T1, T2, T3]
    recommended: [T4]
    systems: [all]
  owner: compliance
  evidence: Regulatory change impact assessment
  frequency: On regulatory change
  on_fail: Escalate to AI Risk Committee
  type: detective
  automation: manual
  key_control: false
  test: Sample 5 regulatory changes logged in the period (or all, if fewer). Confirm each has an impact assessment that names the affected systems, and that the resulting actions were tracked.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/compliance/regulatory-change-monitoring.md

- id: RV-005
  title: Explanation and human review provided for adverse outcomes
  stage: 9
  applies_to:
    text: 'T1-T4 systems that make or support decisions with legal or similarly significant effects on people (EU AI Act Art. 86, GDPR Art. 22(3), Colorado SB 26-189, CPPA ADMT rules, Quebec Law 25 s. 12.1); usually T1 through override item 1'
    tiers: [T1, T2, T3, T4]
    systems: [all]
  owner: system-owner
  evidence: 'Request log per system: date received, request type (explanation, human review, contest, access), decision reference, date answered against the deadline that applies, the explanation sent, and the human review outcome (upheld or changed) with the reviewer''s name. The log also records explanations the law requires without a request (Colorado: within 30 days of an adverse outcome). Deadline: the shortest statutory period that applies (for example one month under GDPR Art. 12(3)); framework default 30 days where none applies'
  frequency: On each request or adverse outcome that triggers a duty; log reviewed at each formal review (RV-001)
  on_fail: Escalate to Compliance; a missed statutory deadline is recorded as a compliance breach
  type: corrective
  automation: manual
  key_control: true
  test: Sample 25 requests from the period across in-scope systems (or all, if fewer). Confirm each was answered within its deadline, the explanation names the system's role and the main elements of the decision, and every human review was done by a reviewer with authority to change the decision. Compare the share of changed decisions with the prior period and confirm any rise was raised at the RV-001 review.
  sources:
  - framework/compliance/eu-ai-act-mapping.md
  - framework/compliance/multi-jurisdictional-guide.md
  - framework/responsible-ai/transparency-standards.md
  - framework/responsible-ai/human-in-loop-patterns.md
