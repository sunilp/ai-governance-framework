# Stage 4 controls: Development & Prompt Engineering.
# Source of truth for the Stage 4 table(s) in framework/governance-operations/control-register.md.
# After editing, run: python tools/build.py && python tools/check.py
# Field reference: tools/README.md. Schema: schemas/controls.schema.json

stage: 4
name: Development & Prompt Engineering
controls:

- id: DE-001
  title: Model card created and version-controlled
  stage: 4
  applies_to:
    text: T1-T4
    tiers: [T1, T2, T3, T4]
    systems: [all]
  owner: ai-lead
  evidence: Model card in version control ([LLM model card](../../templates/llm-model-card.yaml) for GenAI)
  frequency: Before validation
  on_fail: Block validation gate
  type: preventive
  automation: manual
  key_control: false
  test: Sample 25 systems (or all, if fewer). Confirm a model card exists in version control, was committed before the validation gate, and matches the deployed version.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/model-lifecycle/development.md

- id: DE-002
  title: Prompts version-controlled
  stage: 4
  applies_to:
    text: T1-T4 GenAI
    tiers: [T1, T2, T3, T4]
    systems: [genai]
  owner: ai-lead
  evidence: Prompt files in git repository with commit history
  frequency: Continuous
  on_fail: Block deployment
  type: preventive
  automation: semi-automated
  key_control: false
  test: Sample 10 GenAI systems (or all, if fewer) and take the prompt version recorded in the audit trail on 5 dates for each. Confirm every version exists in the prompt repository with commit history.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/llm-lifecycle/prompt-engineering-standards.md

- id: DE-003
  title: Prompt review completed per tier
  stage: 4
  applies_to:
    text: 'T1-T3 GenAI (T3: peer review only; T4: self-review)'
    tiers: [T1, T2, T3]
    systems: [genai]
  owner: ai-lead
  evidence: 'Signed prompt review checklist + prompt version link. Reviewers: T1 peer review + prompt engineering lead + security review + AI Risk sign-off; T2 peer review + prompt engineering lead; T3 peer review'
  frequency: Before release
  on_fail: Block deployment
  type: preventive
  automation: manual
  key_control: false
  test: Sample 25 prompt releases from the period (or all, if fewer), including every T1 release. Inspect the signed checklist for the reviewers required at the tier and a link to the released prompt version.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/llm-lifecycle/prompt-engineering-standards.md

- id: DE-004
  title: Guardrails implemented and configured
  stage: 4
  applies_to:
    text: 'T1-T2 GenAI (T3: recommended)'
    tiers: [T1, T2]
    recommended: [T3]
    systems: [genai]
  owner: technical-owner
  evidence: Guardrail configuration document + test results
  frequency: Before deployment
  on_fail: Block deployment
  type: preventive
  automation: semi-automated
  key_control: false
  test: For every T1 and a sample of 10 T2 GenAI systems (or all, if fewer), compare the production guardrail configuration with the documented configuration. Inspect guardrail test results dated before deployment.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/ai-security/adversarial-robustness.md

- id: DE-005
  title: Data governance controls applied to training/fine-tuning data
  stage: 4
  applies_to:
    text: 'T1-T3 using fine-tuned models (T4: recommended)'
    tiers: [T1, T2, T3]
    recommended: [T4]
    systems: [fine-tuned]
  owner: ai-lead
  evidence: Data governance checklist with provenance documentation
  frequency: Before training
  on_fail: Block training
  type: preventive
  automation: manual
  key_control: false
  test: Sample 10 fine-tuned models (or all, if fewer). Inspect the data governance checklist and provenance records for each training dataset and confirm both were completed before training started.
  sources:
  - framework/governance-operations/governance-workflow.md
  - framework/llm-lifecycle/fine-tuning-governance.md
